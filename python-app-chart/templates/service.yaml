apiVersion: v1
kind: Service
metadata:
  name: {{ include "python-app-chart.fullname" . }}
  labels:
    {{- include "python-app-chart.labels" . | nindent 4 }}

  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "python-app-chart.selectorLabels" . | nindent 4 }}
